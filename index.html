<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дыбыстық талдау — 20 сөз</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Times New Roman",serif;color:#152049;background:radial-gradient(circle at 10% 20%,#fff 0,transparent 33%),linear-gradient(135deg,#d9edff,#f1e7ff 55%,#d8f8e8);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:15px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{border-radius:18px;background:#ffffffdf;padding:9px 17px;font-weight:bold;font-size:clamp(17px,2.5vw,27px);box-shadow:0 4px 14px #3d5d9820}h1{text-align:center;font-size:clamp(30px,4vw,48px);color:#263c91;margin:16px 0 4px}.prompt{text-align:center;font-size:clamp(20px,2.5vw,30px);font-weight:bold}.word{display:flex;justify-content:center;align-items:flex-start;gap:clamp(3px,1.2vw,18px);min-height:230px;margin:22px auto 6px}.letter{flex:0 1 125px;min-width:0;text-align:center;cursor:pointer;user-select:none}.char{font-size:clamp(55px,9vw,115px);font-weight:900;color:#10152e;line-height:1.15;text-transform:uppercase}.slot{width:clamp(35px,5vw,57px);height:clamp(35px,5vw,57px);margin:12px auto 0;border:3px dashed #8d9ab0;border-radius:50%;background:#ffffffb0}.slot.blue,.ball.blue{background:radial-gradient(circle at 30% 24%,#7ac8ff,#116cf0 42%,#003aa9)}.slot.red,.ball.red{background:radial-gradient(circle at 30% 24%,#ff6767,#ed0000 43%,#aa0000)}.slot.filled{border:2px solid #fff;box-shadow:inset -5px -6px 10px #0003,0 5px 10px #244f8040}.panel{background:#fffffff0;max-width:820px;margin:10px auto;border-radius:28px;padding:20px 15px;box-shadow:0 12px 35px #5169a42b;text-align:center}.instruction{font-size:clamp(20px,2.5vw,28px);font-weight:bold}.choices{display:flex;justify-content:space-evenly;gap:20px;margin-top:16px}.choice{background:transparent;border:4px solid transparent;border-radius:22px;padding:7px 15px;display:flex;flex-direction:column;align-items:center;gap:9px;font-family:inherit;font-weight:bold;font-size:clamp(22px,2.5vw,30px);cursor:grab;touch-action:none}.choice.active{border-color:#5b51e9;background:#efecff}.ball{display:block;width:clamp(85px,11vw,126px);height:clamp(85px,11vw,126px);border-radius:50%;box-shadow:inset -9px -10px 15px #0003,0 7px 12px #3856874a}.choice[data-color=blue]{color:#0649a9}.choice[data-color=red]{color:#aa0000}.message{text-align:center;font-weight:bold;font-size:clamp(20px,2.4vw,27px);min-height:42px}.actions{text-align:center}.actions button{font: bold 23px "Times New Roman",serif;background:#4735ce;color:white;border:0;border-radius:15px;padding:12px 25px;cursor:pointer}.actions #next{background:#0783c5}.note{text-align:center;font-size:17px;color:#45537b}.ghost{position:fixed;width:60px;height:60px;border-radius:50%;pointer-events:none;z-index:99;transform:translate(-50%,-50%)}.done{display:none;position:fixed;inset:0;background:#122453a8;align-items:center;justify-content:center;z-index:100}.done.open{display:flex}.done>div{background:white;padding:35px;border-radius:28px;text-align:center;font-size:30px}.done button{font: bold 25px "Times New Roman";padding:12px 25px;border:0;background:#4735ce;color:white;border-radius:14px}@media(max-width:650px){.wrap{padding:10px 6px}.pill{font-size:15px;padding:8px 6px}.word{min-height:175px;gap:1px;margin:20px auto}.char{font-size:clamp(34px,10vw,65px)}.slot{width:clamp(26px,7vw,43px);height:clamp(26px,7vw,43px);margin-top:12px;border-width:2px}.panel{padding:16px 7px}.ball{width:90px;height:90px}.choice{padding:5px;font-size:20px}.instruction{font-size:20px}}
</style></head><body><main class="wrap"><div class="top"><div class="pill" id="timer">⏱ 00:00</div><div class="pill" id="count">Сөз 1 / 20</div><div class="pill" id="stars">⭐ 0</div><button class="pill" id="sound" aria-label="Дыбысты қосу немесе өшіру">🔊</button></div><h1>Дыбыстық талдау</h1><div class="prompt">Сөзді талдаңыз:</div><div class="word" id="word"><div class="letter" data-i="0"><div class="char">қ</div><div class="slot"></div></div><div class="letter" data-i="1"><div class="char">а</div><div class="slot"></div></div><div class="letter" data-i="2"><div class="char">л</div><div class="slot"></div></div><div class="letter" data-i="3"><div class="char">а</div><div class="slot"></div></div></div><section class="panel"><div class="instruction">Дөңгелекті сүйреңіз немесе түсті таңдап, әріпті басыңыз</div><div class="choices"><button class="choice" data-color="blue"><span class="ball blue"></span>Дауыссыз</button><button class="choice" data-color="red"><span class="ball red"></span>Дауысты</button></div></section><div class="message" id="message">Дөңгелекті таңдаңыз</div><div class="actions"><button id="restart">↻ Қайта бастау</button> <button id="next" hidden>Келесі сөз →</button></div><p class="note">Көк — дауыссыз. Қызыл — дауысты. Тексеру автоматты түрде жүреді.</p></main><div class="done" id="done"><div><h2>🏆 Жарайсың!</h2><p id="result"></p><button id="again">Қайта ойнау</button></div></div>
<script>
(function(){
"use strict";
var words=["қала", "бала", "алма", "дала", "шана", "маса", "қалам", "кітап", "терек", "орман", "сабақ", "тарақ", "қасық", "құлан", "терезе", "балапан", "көбелек", "шағала", "қызанақ", "домбыра"], vowels="аәеёиіоөұүыэюя", i=0, stars=0, chosen="", filled=[], locked=false, sound=true, started=Date.now(), audio=null;
function el(id){return document.getElementById(id)}
function chars(){return Array.from(words[i])}
function draw(){
 locked=false;chosen="";filled=chars().map(function(){return false});
 el("count").textContent="Сөз "+(i+1)+" / 20";
 el("message").textContent="Дөңгелекті таңдаңыз";
 el("next").hidden=true;
 document.querySelectorAll(".choice").forEach(function(b){b.classList.remove("active")});
 var box=el("word");box.textContent="";
 chars().forEach(function(c,n){
  var node=document.createElement("div");node.className="letter";node.dataset.i=n;
  var letter=document.createElement("div");letter.className="char";letter.textContent=c;
  var slot=document.createElement("div");slot.className="slot";
  node.appendChild(letter);node.appendChild(slot);box.appendChild(node);
 });
}
function tone(ok){
 if(!sound)return;
 try{var C=window.AudioContext||window.webkitAudioContext;audio=audio||new C();audio.resume();var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=ok?720:200;g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+.26)}catch(e){}

}
function choose(color){chosen=color;document.querySelectorAll(".choice").forEach(function(b){b.classList.toggle("active",b.dataset.color===color)});el("message").textContent=(color==="red"?"Қызыл":"Көк")+" дөңгелек таңдалды"}
function put(n,color){
 if(locked||!color||n<0||n>=filled.length||filled[n])return;
 var good=(vowels.indexOf(chars()[n])>=0?"red":"blue")===color;
 if(!good){el("message").textContent="Қайта таңдаңыз";tone(false);return}
 filled[n]=true;var slot=el("word").children[n].querySelector(".slot");slot.classList.add("filled",color);
 stars++;el("stars").textContent="⭐ "+stars;el("message").textContent="✓";tone(true);
 if(filled.every(Boolean)){locked=true;el("message").textContent="✓ Сөз аяқталды";el("next").hidden=false;if(i===words.length-1){setTimeout(finish,900)}else{setTimeout(function(){if(locked)next()},1700)}}
}
function next(){if(!locked)return;i++;if(i>=words.length)finish();else draw()}
function finish(){el("result").textContent=words.length+" сөз аяқталды! ⭐ "+stars;el("done").classList.add("open")}
function restart(){i=0;stars=0;started=Date.now();el("stars").textContent="⭐ 0";el("done").classList.remove("open");draw()}
el("word").addEventListener("click",function(e){var node=e.target.closest(".letter");if(node)put(Number(node.dataset.i),chosen)});
document.querySelectorAll(".choice").forEach(function(btn){
 var drag=null;
 btn.addEventListener("pointerdown",function(e){drag={x:e.clientX,y:e.clientY,color:btn.dataset.color,moved:false,ghost:null};btn.setPointerCapture(e.pointerId)});
 btn.addEventListener("pointermove",function(e){if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){drag.moved=true;drag.ghost=document.createElement("div");drag.ghost.className="ghost "+drag.color;document.body.appendChild(drag.ghost)}if(drag.ghost){drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px"}});
 btn.addEventListener("pointerup",function(e){if(!drag)return;var d=drag;drag=null;if(d.ghost)d.ghost.remove();if(d.moved){var target=document.elementFromPoint(e.clientX,e.clientY);var node=target&&target.closest(".letter");if(node)put(Number(node.dataset.i),d.color);else choose(d.color)}else choose(d.color)});
 btn.addEventListener("pointercancel",function(){if(drag&&drag.ghost)drag.ghost.remove();drag=null});
});
el("next").onclick=next;el("restart").onclick=restart;el("again").onclick=restart;
el("sound").onclick=function(){sound=!sound;this.textContent=sound?"🔊":"🔇"};
setInterval(function(){var s=Math.floor((Date.now()-started)/1000);el("timer").textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},500);
draw();
})();
</script></body></html>
